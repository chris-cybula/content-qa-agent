<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop all shapes | Little Shapes</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">Little Shapes</a>
      <nav class="site-header__nav" aria-label="Main">
        <a class="site-header__link" href="index.html">Home</a>
        <a class="site-header__link" href="shop.html">Shop</a>
        <a class="site-header__link" href="about.html">About</a>
        <a class="site-header__link" href="news.html">News</a>
        <a class="site-header__link" href="faq.html">FAQ</a>
        <a class="site-header__link" href="delivery.html">Delivery</a>
        <a class="site-header__link" href="contact.html">Contact</a>
      </nav>
    </div>
  </header>
  <main class="page">
    <h1 class="page__title">Shop all shapes</h1>
    <p class="page__text">Every shape is sold on its own, so you can build a set that suits your child.</p>
    <div class="product-grid">
      <article class="product-card">
        <img class="product-card__image" src="images/red-circle.png" alt="Red wooden circle" width="480" height="360">
        <h2 class="product-card__title">Red circle</h2>
        <p class="product-card__price">&pound;8</p>
      </article>
      <article class="product-card">
        <img class="product-card__image" src="images/blue-square.png" alt="Blue wooden square" width="480" height="360">
        <h2 class="product-card__title">Blue square</h2>
        <p class="product-card__price">&pound;8</p>
      </article>
      <article class="product-card">
        <img class="product-card__image" src="images/green-triangle.png" alt="Yellow wooden star" width="480" height="360">
        <h2 class="product-card__title">Green triangle</h2>
        <p class="product-card__price">&pound;9</p>
      </article>
      <article class="product-card">
        <img class="product-card__image" src="images/purple-stripes.png" alt="IMG_0042.png" width="480" height="360">
        <h2 class="product-card__title">Striped block</h2>
        <p class="product-card__price">&pound;10</p>
      </article>
    </div>
  </main>
  <footer class="site-footer">
    <p class="site-footer__text">&copy; 2026 Little Shapes. Little Shapes is a fictional shop.</p>
  </footer>
</body>
</html>
