# CI
# Every pull request: tests on SQLite and Postgres, then the free code-only eval.
# Paid AI eval runs once, only when the run-ai-evals label is added (budget $0.50 per run).

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-eval:
    name: Tests and free eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install packages
        run: pip install -r requirements-dev.txt

      - name: Start Postgres and the demo site
        working-directory: .
        run: docker compose up -d --wait db demo-site

      - name: Create the tables
        run: alembic upgrade head

      - name: Run the tests
        run: python -m pytest -q

      - name: Run the tests on Postgres
        run: |
          docker compose exec -T db createdb -U qa content_qa_test
          python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://qa:qa@localhost:5432/content_qa_test

      - name: Run the free eval
        run: python -m evals.run_evals --label ci --min-precision 1 --min-recall 1

      - name: Upload the eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: api/evals/results/*-ci.json
          if-no-files-found: ignore

  ai-eval:
    name: AI eval
    if: github.event.action == 'labeled' && github.event.label.name == 'run-ai-evals'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install packages
        run: pip install -r requirements-dev.txt

      - name: Start Postgres and the demo site
        working-directory: .
        run: docker compose up -d --wait db demo-site

      - name: Create the tables
        run: alembic upgrade head

      - name: Run the AI eval
        run: python -m evals.run_evals --ai --label ci-ai --min-precision 0.9 --min-recall 0.95
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MONTHLY_BUDGET_USD: "0.50"
          CLAUDE_REQUESTS_PER_MINUTE: "10"
          BRAND_GUIDE_FILE: ../demo-site/brand-guide.md

      - name: Upload the AI eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-results
          path: api/evals/results/*-ci-ai.json
          if-no-files-found: ignore
