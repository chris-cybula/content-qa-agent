<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture | Content QA Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --ground: #0d121e;
  --surface: #141b2a;
  --surface-2: #1a2233;
  --ink: #e8edf4;
  --ink-soft: #b4bece;
  --muted: #8592a4;
  --border: #26314a;
  --accent: #66a2ee;
  --accent-soft: #16243c;
  --accent-line: #2c456b;
  --warm: #e0a660;
  --warm-soft: #2a2012;
  --warm-line: #4a3a1e;
  --db: #5fc2b0;
  --db-soft: #10262a;
  --db-line: #1f4a4a;
  --type: #b79cf2;
  --type-soft: #211a36;
  --type-line: #43366b;
  --ext: #f28bb8;
  --ext-soft: #2e1624;
  --ext-line: #5c2c46;
  --call: #c3ccd9;
  --badge-ink: #0d121e;
  --code-ink: #d6dfee;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 26px rgba(0, 0, 0, 0.35);
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --ground: #f5f7f9;
    --surface: #ffffff;
    --surface-2: #eef1f6;
    --ink: #19212e;
    --ink-soft: #404b5c;
    --muted: #6b7788;
    --border: #e1e6ed;
    --accent: #1d5fa8;
    --accent-soft: #e7f0fa;
    --accent-line: #bcd4ee;
    --warm: #b0631a;
    --warm-soft: #f6ecdf;
    --warm-line: #e7cfac;
    --db: #1f7a6c;
    --db-soft: #e4f2ef;
    --db-line: #b9ddd6;
    --type: #6a47c0;
    --type-soft: #f0ebfb;
    --type-line: #d4c7f2;
    --ext: #b8336a;
    --ext-soft: #fbe9f1;
    --ext-line: #efc3d6;
    --call: #3d4757;
    --badge-ink: #ffffff;
    --code-ink: #232d3c;
    --shadow: 0 1px 2px rgba(20, 30, 50, 0.05), 0 6px 20px rgba(20, 30, 50, 0.06);
  }
}

:root[data-theme="light"] {
  color-scheme: light;
  --ground: #f5f7f9;
  --surface: #ffffff;
  --surface-2: #eef1f6;
  --ink: #19212e;
  --ink-soft: #404b5c;
  --muted: #6b7788;
  --border: #e1e6ed;
  --accent: #1d5fa8;
  --accent-soft: #e7f0fa;
  --accent-line: #bcd4ee;
  --warm: #b0631a;
  --warm-soft: #f6ecdf;
  --warm-line: #e7cfac;
  --db: #1f7a6c;
  --db-soft: #e4f2ef;
  --db-line: #b9ddd6;
  --type: #6a47c0;
  --type-soft: #f0ebfb;
  --type-line: #d4c7f2;
  --ext: #b8336a;
  --ext-soft: #fbe9f1;
  --ext-line: #efc3d6;
  --call: #3d4757;
  --badge-ink: #ffffff;
  --code-ink: #232d3c;
  --shadow: 0 1px 2px rgba(20, 30, 50, 0.05), 0 6px 20px rgba(20, 30, 50, 0.06);
}
</style>
<style>
*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 1rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
</style>
<style>
.layout {
  max-width: 82.5rem;
  margin-inline: auto;
  padding: 0 1.5rem 4rem;
}

.hero {
  padding-top: 2.5rem;
}

.hero__eyebrow {
  margin: 0;
  color: var(--accent);
  font: 600 0.75rem/1.3 "IBM Plex Mono", ui-monospace, monospace;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.hero__title {
  margin: 0.25em 0 0;
  font-family: "Fraunces", Georgia, serif;
  font-size: clamp(2rem, 4.6vw, 3.1rem);
  font-weight: 600;
  line-height: 1.05;
  letter-spacing: -0.02em;
  text-wrap: balance;
}

.inline-code {
  padding: 0 0.25rem;
  border: 1px solid var(--border);
  border-radius: 5px;
  background: var(--surface-2);
  color: var(--code-ink);
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 0.86em;
  word-break: break-word;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.75rem;
  margin-top: 1.5rem;
}

.tabs {
  display: flex;
  flex: 1 1 35rem;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.tabs__tab {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.125rem;
  padding: 0.5rem 0.875rem 0.5625rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  color: var(--ink-soft);
  font: inherit;
  text-align: left;
  cursor: pointer;
  appearance: none;
}

.tabs__tab:hover {
  border-color: var(--accent-line);
}

.tabs__tab:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.tabs__tab[aria-selected="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.tabs__tab[aria-selected="true"] .tabs__name {
  color: var(--accent);
}

.tabs__name {
  color: var(--ink);
  font-size: 0.90625rem;
  font-weight: 600;
  line-height: 1.25;
}

.tabs__sub {
  color: var(--muted);
  font: 500 0.71875rem/1.2 "IBM Plex Mono", ui-monospace, monospace;
}

.figure {
  margin: 0.875rem 0 1.5rem;
  padding: 0.625rem;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.figure__hint {
  display: none;
  padding: 0.125rem 0.375rem 0.5rem;
  color: var(--muted);
  font: 500 0.75rem/1.3 "IBM Plex Mono", ui-monospace, monospace;
}

.figure__scroller {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.figure__legend {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem 1.375rem;
  margin-top: 0.375rem;
  padding: 0.625rem 0.375rem 0.25rem;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font: 500 0.75rem/1.3 "IBM Plex Mono", ui-monospace, monospace;
}

.figure__legend-item {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

.map {
  display: block;
  width: 100%;
  min-width: 70rem;
  height: auto;
  user-select: none;
}

.map__zone-box {
  fill: var(--surface-2);
  stroke: var(--border);
  stroke-dasharray: 4 4;
}

.map__zone-label {
  fill: var(--muted);
  font: 600 0.6875rem "IBM Plex Mono", ui-monospace, monospace;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.map__marker-head--call {
  fill: var(--call);
}

.map__marker-head--data {
  fill: var(--db);
}

.map__marker-head--config {
  fill: var(--warm);
}

.map__marker-head--test {
  fill: var(--type);
}

.map__marker-head--model {
  fill: var(--type);
}

.map__marker-head--ext {
  fill: var(--ext);
}

.map__marker-head--doc {
  fill: var(--muted);
}

.map-node {
  cursor: pointer;
  transition: opacity 0.18s;
}

.map-node:focus {
  outline: none;
}

.map-node:hover .map-node__box,
.map-node:focus-visible .map-node__box {
  stroke-width: 2.4;
}

.map-node--dim {
  opacity: 0.13;
}

.map-node__box {
  stroke-width: 1.4;
  transition: stroke-width 0.15s;
}

.map-node__box--selected {
  stroke-width: 3;
}

.map-node__box--you {
  fill: var(--surface);
  stroke: var(--ink-soft);
}

.map-node__box--web {
  fill: var(--surface);
  stroke: var(--accent-line);
}

.map-node__box--api {
  fill: var(--accent-soft);
  stroke: var(--accent);
}

.map-node__box--model {
  fill: var(--type-soft);
  stroke: var(--type);
}

.map-node__box--test {
  fill: var(--surface);
  stroke: var(--type-line);
}

.map-node__box--secret {
  fill: var(--warm-soft);
  stroke: var(--warm);
}

.map-node__box--config {
  fill: var(--surface);
  stroke: var(--warm-line);
}

.map-node__box--script {
  fill: var(--surface);
  stroke: var(--ext-line);
}

.map-node__box--docker {
  fill: var(--db-soft);
  stroke: var(--db);
}

.map-node__box--site {
  fill: var(--surface);
  stroke: var(--db-line);
}

.map-node__box--doc {
  fill: var(--surface);
  stroke: var(--border);
  stroke-dasharray: 5 4;
}

.map-node__box--ext {
  fill: var(--ext-soft);
  stroke: var(--ext);
}

.map-node__box--data {
  fill: var(--surface);
  stroke: var(--db);
}

.map-node__box--crawl {
  fill: var(--surface);
  stroke: var(--accent);
}

.map-node__box--http {
  fill: var(--surface);
  stroke: var(--call);
}

.map-node__box--check {
  fill: var(--warm-soft);
  stroke: var(--warm-line);
}

.map-node__box--app {
  fill: var(--surface);
  stroke: var(--accent);
}

.map-node__box--ai {
  fill: var(--ext-soft);
  stroke: var(--ext-line);
}

.map-node__box--guard {
  fill: var(--surface);
  stroke: var(--ext);
}

.map-node__title {
  fill: var(--ink);
  font: 600 0.9375rem "IBM Plex Sans", system-ui, sans-serif;
}

.map-node__sub {
  fill: var(--muted);
  font: 500 0.71875rem "IBM Plex Mono", ui-monospace, monospace;
}

.map-node__line {
  fill: var(--ink-soft);
  font: 500 0.75rem "IBM Plex Mono", ui-monospace, monospace;
}

.map-node__tag-box {
  fill: var(--surface-2);
  stroke: var(--border);
}

.map-node__tag-text {
  fill: var(--muted);
  font: 600 0.625rem "IBM Plex Sans", system-ui, sans-serif;
  letter-spacing: 0.09em;
}

.map-node__info {
  cursor: pointer;
}

.map-node__info:focus {
  outline: none;
}

.map-node__info:hover .map-node__info-circle,
.map-node__info:focus-visible .map-node__info-circle {
  fill: var(--accent);
  stroke: var(--accent);
}

.map-node__info:hover .map-node__info-text,
.map-node__info:focus-visible .map-node__info-text {
  fill: var(--badge-ink);
}

.map-node__info-circle {
  fill: var(--surface);
  stroke: var(--muted);
  stroke-width: 1.2;
  transition: fill 0.15s, stroke 0.15s;
}

.map-node__info-text {
  fill: var(--muted);
  font: italic 700 0.6875rem Georgia, "Times New Roman", serif;
  text-anchor: middle;
  dominant-baseline: central;
  pointer-events: none;
}

.map-edge {
  transition: opacity 0.18s;
}

.map-edge:hover .map-edge__line {
  stroke-width: 3.2;
}

.map-edge--dim {
  opacity: 0.13;
}

.map-edge__hit {
  fill: none;
  stroke: transparent;
  stroke-width: 16;
  cursor: help;
}

.map-edge__line {
  fill: none;
  stroke-width: 2;
  stroke-linejoin: round;
}

.map-edge__line--hot {
  stroke-width: 3.4;
}

.map-edge__line--call {
  stroke: var(--call);
}

.map-edge__line--data {
  stroke: var(--db);
}

.map-edge__line--config {
  stroke: var(--warm);
  stroke-dasharray: 7 5;
}

.map-edge__line--test {
  stroke: var(--type);
  stroke-dasharray: 7 5;
}

.map-edge__line--model {
  stroke: var(--type);
}

.map-edge__line--ext {
  stroke: var(--ext);
}

.map-edge__line--doc {
  stroke: var(--muted);
  stroke-dasharray: 1.5 5;
  stroke-linecap: round;
}

.map-edge__label {
  font: 500 0.6875rem "IBM Plex Mono", ui-monospace, monospace;
  paint-order: stroke;
  stroke: var(--surface);
  stroke-width: 5px;
  stroke-linejoin: round;
}

.map-edge__label--call {
  fill: var(--ink-soft);
}

.map-edge__label--data {
  fill: var(--db);
}

.map-edge__label--config {
  fill: var(--warm);
}

.map-edge__label--test,
.map-edge__label--model {
  fill: var(--type);
}

.map-edge__label--ext {
  fill: var(--ext);
}

.map-edge__label--doc {
  fill: var(--muted);
}

.map-badge {
  cursor: help;
}

.map-badge__circle {
  stroke: var(--surface);
  stroke-width: 2.5;
}

.map-badge__circle--call {
  fill: var(--call);
}

.map-badge__circle--data {
  fill: var(--db);
}

.map-badge__circle--config {
  fill: var(--warm);
}

.map-badge__circle--test,
.map-badge__circle--model {
  fill: var(--type);
}

.map-badge__circle--ext {
  fill: var(--ext);
}

.map-badge__circle--doc {
  fill: var(--muted);
}

.map-badge__text {
  fill: var(--badge-ink);
  font: 700 0.71875rem "IBM Plex Sans", system-ui, sans-serif;
  text-anchor: middle;
  dominant-baseline: central;
}

.guide {
  display: grid;
  gap: 0.75rem;
  max-width: 52rem;
}

.guide--hidden {
  display: none;
}

.guide__header {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.5rem 1rem;
}

.guide__title {
  margin: 0;
  font-family: "Fraunces", Georgia, serif;
  font-size: 1.375rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.guide__controls {
  display: flex;
  align-items: center;
  gap: 0.375rem;
}

.guide__nav {
  padding: 0.25rem 0.625rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--ink);
  font: 600 0.875rem/1 "IBM Plex Sans", system-ui, sans-serif;
  cursor: pointer;
  appearance: none;
}

.guide__nav:hover {
  border-color: var(--accent-line);
}

.guide__nav:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.guide__nav:disabled {
  border-color: var(--border);
  color: var(--muted);
  opacity: 0.45;
  cursor: default;
}

.guide__nav--hidden {
  display: none;
}

.guide__reset {
  padding: 0.375rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
  font: 500 0.75rem/1 "IBM Plex Mono", ui-monospace, monospace;
  cursor: pointer;
  appearance: none;
}

.guide__reset:hover {
  color: var(--ink);
}

.guide__reset:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.guide__reset--hidden {
  display: none;
}

.guide__intro {
  margin: 0;
  color: var(--ink-soft);
}

.guide__list {
  display: grid;
  gap: 0.5rem;
  margin: 0;
  padding: 0;
  list-style: none;
}

.guide__step {
  display: grid;
  grid-template-columns: 1.5rem 1fr;
  gap: 0.75rem;
  width: 100%;
  padding: 0.625rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  color: var(--ink-soft);
  font: inherit;
  font-size: 0.90625rem;
  text-align: left;
  cursor: pointer;
  appearance: none;
}

.guide__step:hover {
  border-color: var(--accent-line);
}

.guide__step:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.guide__step[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.guide__num {
  display: inline-grid;
  place-items: center;
  width: 1.5rem;
  height: 1.5rem;
  border-radius: 50%;
  color: var(--badge-ink);
  font: 700 0.75rem/1 "IBM Plex Sans", system-ui, sans-serif;
}

.guide__num--call {
  background: var(--call);
}

.guide__num--data {
  background: var(--db);
}

.guide__num--config {
  background: var(--warm);
}

.guide__num--test,
.guide__num--model {
  background: var(--type);
}

.guide__num--ext {
  background: var(--ext);
}

.guide__num--doc {
  background: var(--muted);
}

.guide__ref {
  display: block;
  margin-top: 0.25rem;
  color: var(--muted);
  font: 500 0.75rem/1.4 "IBM Plex Mono", ui-monospace, monospace;
}

.modal {
  width: min(38.75rem, calc(100vw - 2rem));
  max-height: min(86vh, 57.5rem);
  padding: 0;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
}

.modal::backdrop {
  background: rgba(8, 12, 20, 0.5);
}

.modal__inner {
  position: relative;
  padding: 1.375rem 1.5rem 1.5rem;
}

.modal__close {
  position: absolute;
  top: 1.125rem;
  right: 1.125rem;
  padding: 0.375rem 0.625rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
  font: 500 0.75rem/1 "IBM Plex Mono", ui-monospace, monospace;
  cursor: pointer;
  appearance: none;
}

.modal__close:hover {
  color: var(--ink);
}

.modal__close:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.modal__title {
  margin: 0 0 0.25rem;
  padding-right: 4.375rem;
  font-family: "Fraunces", Georgia, serif;
  font-size: 1.5rem;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: -0.01em;
}

.modal__file {
  margin: 0 0 0.625rem;
  color: var(--muted);
  font: 500 0.78125rem/1.4 "IBM Plex Mono", ui-monospace, monospace;
}

.modal__text {
  margin: 0 0 0.625rem;
  color: var(--ink-soft);
  font-size: 0.90625rem;
}

.modal__code {
  margin: 0.375rem 0 0;
  padding: 0.625rem 0.75rem;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-2);
  color: var(--code-ink);
  font: 500 0.78125rem/1.55 "IBM Plex Mono", ui-monospace, monospace;
  white-space: pre;
}

.modal__heading {
  margin: 1rem 0 0.5rem;
  color: var(--muted);
  font: 600 0.71875rem/1 "IBM Plex Mono", ui-monospace, monospace;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.modal__links {
  display: flex;
  flex-direction: column;
  gap: 0.375rem;
  margin: 0;
  padding: 0;
  list-style: none;
}

.modal__link {
  display: grid;
  grid-template-columns: 0.875rem 1fr;
  align-items: start;
  gap: 0.5rem;
  color: var(--ink-soft);
  font-size: 0.875rem;
}

.modal__swatch {
  width: 0.875rem;
  height: 3px;
  margin-top: 0.625rem;
  border-radius: 2px;
}

.modal__swatch--call {
  background: var(--call);
}

.modal__swatch--data {
  background: var(--db);
}

.modal__swatch--config {
  background: var(--warm);
}

.modal__swatch--test,
.modal__swatch--model {
  background: var(--type);
}

.modal__swatch--ext {
  background: var(--ext);
}

.modal__swatch--doc {
  background: var(--muted);
}

.modal__go {
  padding: 0;
  border: 0;
  background: none;
  color: var(--ink);
  font: inherit;
  font-weight: 600;
  text-decoration: underline;
  text-decoration-color: var(--border);
  text-underline-offset: 3px;
  cursor: pointer;
  appearance: none;
}

.modal__go:hover {
  text-decoration-color: var(--accent);
}

.modal__go:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (max-width: 75rem) {
  .figure__hint {
    display: block;
  }
}

@media (max-width: 37.5rem) {
  .layout {
    padding-inline: 1rem;
  }
}
</style>
</head>
<body>
<main class="layout">

};

function placeText(n) {
  let tagLeft = Infinity;
  if (n.tagText) {
    const width = n.tagText.getComputedTextLength() + 18;
    tagLeft = n.x + n.w - 11 - width;
    n.tagBox.setAttribute('x', tagLeft);
    n.tagBox.setAttribute('width', width);
  }
  const [title, sub, ...lines] = n.texts;
  const drop = n.x + 14 + title.getComputedTextLength() + 10 > tagLeft ? 24 : 0;
  title.setAttribute('y', n.y + 26 + drop);
  sub.setAttribute('y', n.y + 44 + drop);
  lines.forEach((line, i) => line.setAttribute('y', n.y + 68 + drop + i * 17));
}

  const saved = JSON.parse(localStorage.getItem(viewKey) || 'null');
  const savedView = saved && VIEWS.find(v => v.id === saved.view);
  if (savedView) {
    state.view = savedView.id;
    if (savedView.steps && Number.isInteger(saved.step) && saved.step >= 0 && saved.step < savedView.steps.length) state.step = saved.step;
  }
} catch (e) {}

function saveView() {
  try { localStorage.setItem(viewKey, JSON.stringify({view: state.view, step: state.step})); } catch (e) {}
}

const tabs = document.querySelector('[data-tabs]');
for (const v of VIEWS) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'tabs__tab';
  button.setAttribute('role', 'tab');
  button.dataset.view = v.id;
  button.innerHTML = `<span class="tabs__name">${v.name}</span><span class="tabs__sub">${v.sub}</span>`;
  tabs.appendChild(button);
}
tabs.addEventListener('click', ev => {
  const button = ev.target.closest('[data-view]');
  if (!button) return;
  state.view = button.dataset.view;
  state.sel = null;
  state.step = null;
  render();
});

const guide = document.querySelector('[data-guide]');
const guideTitle = document.querySelector('[data-guide-title]');
const guideIntro = document.querySelector('[data-guide-intro]');
const guideList = document.querySelector('[data-guide-list]');
const guideReset = document.querySelector('[data-guide-reset]');
guideList.addEventListener('click', ev => {
  const button = ev.target.closest('[data-step]');
  if (!button) return;
  const index = Number(button.dataset.step);
  state.step = state.step === index ? null : index;
  state.sel = null;
  render();
});
guideReset.addEventListener('click', () => {
  state.step = null;
  state.sel = null;
  render();
});

const guidePrev = document.querySelector('[data-guide-prev]');
const guideNext = document.querySelector('[data-guide-next]');

function stepBy(delta) {
  const steps = VIEWS.find(v => v.id === state.view).steps;
  if (state.sel || !steps || !steps.length) return false;
  const target = state.step == null ? (delta > 0 ? 0 : null) : state.step + delta;
  if (target != null && target >= 0 && target < steps.length) {
    state.step = target;
    render();
  }
  return true;
}

guidePrev.addEventListener('click', () => stepBy(-1));
guideNext.addEventListener('click', () => stepBy(1));
document.addEventListener('keydown', ev => {
  if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft' && ev.key !== 'Escape') return;
  if (ev.altKey || ev.ctrlKey || ev.metaKey || ev.shiftKey || modal.open) return;
  const focused = document.activeElement;
  if (focused && focused.closest('[data-view], [data-step], [data-guide-prev], [data-guide-next], [data-node]')) focused.blur();
  if (ev.key === 'Escape') {
    if (state.step == null && !state.sel) return;
    state.step = null;
    state.sel = null;
    render();
    ev.preventDefault();
    return;
  }
  if (stepBy(ev.key === 'ArrowRight' ? 1 : -1)) ev.preventDefault();
});

function stepKind(step) {
  return step.e.length ? EI[step.e[0]].k : 'call';
}

function firstStepOf(steps) {
  const first = {};
  steps.forEach((s, i) => s.e.forEach(id => { if (!(id in first)) first[id] = i + 1; }));
  return first;
}

function renderGuide(view) {
  guide.classList.toggle('guide--hidden', !state.sel && !view.steps);
  const count = state.sel ? 0 : (view.steps || []).length;
  guidePrev.classList.toggle('guide__nav--hidden', count === 0);
  guideNext.classList.toggle('guide__nav--hidden', count === 0);
  guidePrev.disabled = state.step == null || state.step === 0;
  guideNext.disabled = state.step === count - 1;
  if (state.sel) {
    guideTitle.textContent = N[state.sel].t;
    guideIntro.textContent = 'Showing only the arrows that touch ' + N[state.sel].t + '. Click it again, or an empty part of the map, to go back.';
    guideList.innerHTML = '';
    guideReset.classList.add('guide__reset--hidden');
    return;
  }
  guideTitle.textContent = view.name;
  guideIntro.textContent = view.intro;
  guideReset.classList.toggle('guide__reset--hidden', state.step == null);
  guideList.innerHTML = (view.steps || []).map((s, i) => `
    <li>
      <button class="guide__step" type="button" aria-pressed="${state.step === i}" data-step="${i}">
        <span class="guide__num guide__num--${stepKind(s)}">${i + 1}</span>
        <span>${rich(s.t)}${s.r ? `<span class="guide__ref">${s.r}</span>` : ''}</span>
      </button>
    </li>`).join('');
}

function render() {
  const view = VIEWS.find(v => v.id === state.view);
  const steps = view.steps;
  for (const button of tabs.querySelectorAll('[data-view]')) {
    button.setAttribute('aria-selected', String(button.dataset.view === state.view));
  }

  let onEdges;
  let onNodes;
  if (state.sel) {
    onEdges = new Set(E.filter(e => e.from === state.sel || e.to === state.sel).map(e => e.id));
    onNodes = new Set([state.sel]);
  } else if (steps) {
    const active = state.step != null ? [steps[state.step]] : steps;
    onEdges = new Set(active.flatMap(s => s.e));
    onNodes = new Set(active.flatMap(s => s.n || []));
  } else {
    onEdges = new Set(E.map(e => e.id));
    onNodes = new Set(Object.keys(N));
  }
  onEdges.forEach(id => { onNodes.add(EI[id].from); onNodes.add(EI[id].to); });

  for (const e of E) {
    edgeEls[e.id].classList.toggle('map-edge--dim', !onEdges.has(e.id));
    e.line.classList.toggle('map-edge__line--hot', state.step != null && onEdges.has(e.id));
  }
  for (const [id, n] of Object.entries(N)) {
    nodeEls[id].classList.toggle('map-node--dim', !onNodes.has(id));
    const picked = state.sel === id || (state.step != null && (steps[state.step].n || []).includes(id));
    n.box.classList.toggle('map-node__box--selected', picked);
  }

  badgeLayer.replaceChildren();
  if (steps && !state.sel) {
    for (const [id, number] of Object.entries(firstStepOf(steps))) {
      if (state.step != null && !steps[state.step].e.includes(id)) continue;
      const e = EI[id];
      const point = e.line.getPointAtLength(e.line.getTotalLength() * 0.5);
      const g = el('g', {class: 'map-badge'}, badgeLayer);
      el('circle', {class: 'map-badge__circle map-badge__circle--' + e.k, cx: point.x, cy: point.y, r: 11}, g);
      txt(g, point.x, point.y + 0.5, 'map-badge__text', String(number));
      const step = steps[number - 1];
      el('title', {}, g).textContent = number + '. ' + plain(step.t);
    }
  }
  renderGuide(view);
  saveView();
}

const modal = document.querySelector('[data-modal]');
const modalBody = document.querySelector('[data-modal-body]');

function linkList(list, direction) {
  if (!list.length) return '<li class="modal__link"><span></span><span>nothing</span></li>';
  return list.map(e => {
    const other = direction === 'in' ? e.from : e.to;
    return `<li class="modal__link"><span class="modal__swatch modal__swatch--${e.k}"></span><span><button class="modal__go" type="button" data-go="${other}">${N[other].t}</button>: ${esc(e.say)}</span></li>`;
  }).join('');
}

function openInfo(id) {
  const n = N[id];
  const ins = E.filter(e => e.to === id);
  const outs = E.filter(e => e.from === id);
  modalBody.innerHTML = `
    <button class="modal__close" type="button" data-close>close ×</button>
    <h2 class="modal__title" id="modal-title">${n.t}</h2>
    <p class="modal__file">${n.file}</p>
    <p class="modal__text">${rich(n.what)}</p>
    ${n.code ? `<pre class="modal__code">${esc(n.code)}</pre>` : ''}
    <h3 class="modal__heading">Comes from (arrows in)</h3>
    <ul class="modal__links">${linkList(ins, 'in')}</ul>
    <h3 class="modal__heading">Goes to (arrows out)</h3>
    <ul class="modal__links">${linkList(outs, 'out')}</ul>`;
  modal.scrollTop = 0;
  if (!modal.open) modal.showModal();
}

modal.addEventListener('click', ev => {
  const go = ev.target.closest('[data-go]');
  if (go) { openInfo(go.dataset.go); return; }
  if (ev.target.closest('[data-close]') || ev.target === modal) modal.close();
});

function select(id) {
  state.sel = id;
  state.step = null;
  render();
}

render();
</script>
</body>
</html>
